<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-ice-maskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1120" />
      <stop offset="50%" stop-color="#0f1d36" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <linearGradient id="facet-left-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="facet-center-left-m" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <linearGradient id="facet-center-right-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="facet-right-m" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for Android Adaptive/Maskable Icon -->
  <rect width="512" height="512" fill="url(#bg-ice-maskable)" />

  <!-- Inner safe zone (scaled to 76% centered) -->
  <g transform="translate(61.44, 61.44) scale(0.76)">
    <polygon points="256,76 396,156 396,356 256,436 116,356 116,156" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="6 8" />
    
    <polygon points="120,160 164,160 216,380 180,380" fill="url(#facet-left-m)" />
    <polygon points="180,380 216,380 256,260 240,240" fill="url(#facet-center-left-m)" />
    <polygon points="240,240 256,216 272,240 256,264" fill="#ffffff" />
    <polygon points="272,240 256,260 296,380 332,380" fill="url(#facet-center-right-m)" />
    <polygon points="332,380 296,380 348,160 392,160" fill="url(#facet-right-m)" />

    <polyline points="120,160 180,380 256,216 332,380 392,160" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="164" y1="160" x2="216" y2="380" stroke="#bae6fd" stroke-width="2" stroke-opacity="0.8" />
    <line x1="348" y1="160" x2="296" y2="380" stroke="#bae6fd" stroke-width="2" stroke-opacity="0.8" />

    <!-- Sparkles -->
    <g transform="translate(120, 160)">
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
      <path d="M 0 -14 L 0 14 M -14 0 L 14 0" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
    </g>
    <g transform="translate(256, 216)">
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
      <path d="M 0 -18 L 0 18 M -18 0 L 18 0 M -7 -7 L 7 7 M -7 7 L 7 -7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <g transform="translate(392, 160)">
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
      <path d="M 0 -14 L 0 14 M -14 0 L 14 0" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
